<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retro Web Games</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Retro Web Games</h1>
      <p class="subtitle">Step 1: Load test</p>
    </header>

    <section>
      <label for="pin">Group PIN (6 digits)</label>
      <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
      <button id="savePin">Save PIN</button>
      <div class="hint" id="pinStatus"></div>
    </section>

    <hr />

    <section>
      <button id="startGame">Start Game</button>
      <button id="testOverlay">Test Overlay on Current Page</button>
      <div class="hint">Press Esc to close overlay</div>
    </section>

    <footer>
      <button id="openSwLogs">Open Service Worker Logs</button>
    </footer>

    <script src="popup.js"></script>
  </body>
  </html>
